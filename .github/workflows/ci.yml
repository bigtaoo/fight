name: ci

# Every push and pull request runs `npm run check` (typecheck, tests, the web build). A push to
# main that passes then publishes the web build to Cloudflare at f.gamestao.com
# (wrangler/web.jsonc). Adapted from D:\standing's ci.yml; there is no server deploy yet, so the
# web build plays offline.
#
# The deploy needs, in Settings -> Secrets and variables -> Actions:
#   Secrets    CLOUDFLARE_API_TOKEN   gamestao.com account, at least Workers Scripts:Edit
#              CLOUDFLARE_ACCOUNT_ID
#   Variables  WEB_DEPLOY_ENABLED = true   (unset: the deploy is skipped, so CI stays green
#                                          before the secrets are in)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# a newer push cancels an older run, except on main, where a deploy may be halfway through
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      # hand the build that was just checked to the deploy, so it ships exactly that
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        with:
          name: web-dist
          path: client/dist
          retention-days: 7

  deploy-web:
    needs: check
    runs-on: ubuntu-latest
    if: ${{ vars.WEB_DEPLOY_ENABLED == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    concurrency:
      group: web-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: client/dist
      - name: deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.118.0 deploy -c wrangler/web.jsonc
      - name: verify from the outside
        run: |
          set -eu
          for i in $(seq 1 10); do
            if curl -fsS --max-time 10 -o /dev/null https://f.gamestao.com/; then exit 0; fi
            sleep 3
          done
          echo "f.gamestao.com did not answer" >&2
          exit 1
